name: Sync Kagoshima swim federation calendar

on:
  workflow_dispatch:
    inputs:
      force_page_build:
        description: Rebuild GitHub Pages even if the calendar data did not change
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download and normalize the public calendar
        run: node scripts/sync-calendar.mjs

      - name: Commit changed calendar data
        id: commit-calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meets.json
          if git diff --cached --quiet; then
            echo "Calendar data is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync Kagoshima swim federation calendar"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request a GitHub Pages build when needed
        if: steps.commit-calendar.outputs.changed == 'true' || inputs.force_page_build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
